[project]
name = "data-governance-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langfuse>=4.15.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-magic>=0.4.27",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
    "sqlglot>=30.18.0",
    "streamlit>=1.63.0",
    "unstructured[pdf]>=0.27.5",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "faker>=40.38.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
